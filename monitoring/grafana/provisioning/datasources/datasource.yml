apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "logs-*"
    editable: true
    jsonData:
      timeField: "@timestamp"
      # 8.x é o que o docker-compose sobe; ajuste se o cluster do cliente
      # for outra versão.
      esVersion: "8.0.0"
