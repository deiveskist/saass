[project]
name = "supportability-agent"
version = "0.1.0"
description = "LangGraph agent that orchestrates the supportability-mcp tools to investigate a support ticket end to end."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
supportability-agent = "supportability_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
